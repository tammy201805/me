        html, body {

        .footer-section {

            left: 0;
            right: 0;

        .toast {

            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background-color: rgba(0, 0, 0, 0.8);
            color: white;
            padding: 8px 20px;
            border-radius: 4px;
            font-size: 14px;
            height: 36px;
            line-height: 20px;
            z-index: 99999;
            opacity: 0;
            pointer-events: none;

        .toast.show {

            margin-bottom: 1rem;
        }

        .grid {
            max-width: 100%;
            margin-top: 1rem;
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 1rem;
        }

        .glass-card {
            padding: 1rem;
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(1, 1, 32, 0.06);
        }

        .glass-card .text-base {
            font-size: clamp(1rem, 4vw, 1.2rem);
        }

        .glass-card .text-sm {
            font-size: clamp(0.9rem, 3vw, 1rem);
        }

        .copy-label {
            font-size: clamp(0.7rem, 2.5vw, 0.8rem);
        }

        .text-cloud-pink {
            color: rgb(239, 44, 193);
        }

        header {
            padding: 1rem 1.5rem;
        }

        footer {
            padding: 1rem 1.5rem 0 1.5rem;
        }

        @media (max-width: 768px) {
            .grid {
                grid-template-columns: repeat(2, 1fr);
                gap: 0.8rem;
            }
            
            .glass-card {
                padding: 0.8rem;
            }
            
            #heroText h1 {
                font-size: clamp(1.8rem, 7vw, 3rem);
            }
            
            #heroText h2 {
                font-size: clamp(1rem, 4vw, 2rem);
            }
        }

        @media (max-width: 480px) {
            .grid {
                grid-template-columns: repeat(2, 1fr);
                gap: 0.6rem;
            }
            
            .glass-card {
                padding: 0.6rem;
            }
            
            #heroText h1 {
                font-size: clamp(1.5rem, 6vw, 2.5rem);
            }
            
            #heroText h2 {
                font-size: clamp(0.9rem, 3vw, 1.5rem);
            }
            
            .hero-content {
                padding: 20px 15px;
            }
            
            main {
                padding: 0 0.8rem;
            }
            
            header {
                padding: 0.8rem 1rem;
            }
            
            footer {
                padding: 0.8rem 1rem 0 1rem;
            }
        }

        .footer-content {
            display: flex;
            align-items: center;
            justify-content: space-between;
            max-width: 1200px;
            margin: 0 auto;
            width: 100%;
            flex-wrap: wrap;
            gap: 1rem;
        }

        .footer-content .message,

            white-space: nowrap;
        }

        .footer-content .message {

        .footer-content .contact-details {

        .footer-content .disclaimer {

        @media (max-width: 768px) {

        }

    <div class="toast" id="toast">已复制</div>
    
    <script>
        function copyToClipboard(text, element, highlightColorClass, showToast = true) {
            const textArea = document.createElement("textarea");
            textArea.value = text;
            textArea.style.position = "fixed";
            textArea.style.opacity = "0";
            document.body.appendChild(textArea);
            textArea.focus();
            textArea.select();
            
            try {
                document.execCommand('copy');
                
                // 根据参数决定是否显示toast提示
                if (showToast) {
                    const toast = document.getElementById('toast');
                    
                    // 计算点击元素的位置
                    if (element) {
                        const rect = element.getBoundingClientRect();
                        const toastHeight = 36;
                        
                        // 设置toast位置在点击元素的正上方 10px
                        toast.style.top = `${rect.top - toastHeight - 10}px`;
                        toast.style.left = `${rect.left + (rect.width) / 2}px`;
                        toast.style.transform = 'translate(-50%, 0)';
                    } else {
                        // 如果没有元素，默认显示在页面中心
                        toast.style.top = '50%';
                        toast.style.left = '50%';
                        toast.style.transform = 'translate(-50%, -50%)';
                    }
                    
                    toast.classList.add('show');
                    setTimeout(() => {
                        toast.classList.remove('show');
                    }, 2000);
                }
                
                if (element && highlightColorClass) {
                    const label = element.querySelector('.copy-label');
                    const icon = element.querySelector('.copy-icon');
                    const originalText = label.innerText;
                    const originalSVG = icon.innerHTML;
                    
                    label.innerText = '已复制';
                    label.classList.add(highlightColorClass);
                    icon.innerHTML = '<path stroke-linecap="square" stroke-linejoin="miter" stroke-width="2" d="M5 13l4 4L19 7"></path>';
                    icon.classList.add(highlightColorClass);

                    setTimeout(() => {
                        label.innerText = originalText;
                        label.classList.remove(highlightColorClass);
                        icon.innerHTML = originalSVG;
                        icon.classList.remove(highlightColorClass);
                    }, 2000);
                }
                
            } catch (err) {
                console.error('复制失败', err);
            }
            
            document.body.removeChild(textArea);
        }
        
        document.addEventListener('contextmenu', function(e) {
            e.preventDefault();
        });
        
        // 确保DOM加载完成后执行
        document.addEventListener('DOMContentLoaded', function() {
            // 初始化时检查一次
            checkFooterPosition();
            
            // 监听滚动事件
            window.addEventListener('scroll', checkFooterPosition);
        });
        
        function checkFooterPosition() {
            const heroSection = document.querySelector('.hero-section');
            const footerSection = document.querySelector('.footer-section');
            
            if (heroSection && footerSection) {
                const heroBottom = heroSection.offsetTop + heroSection.offsetHeight;
                const scrollTop = window.pageYOffset || document.documentElement.scrollTop;
                const windowHeight = window.innerHeight;
                const documentHeight = document.documentElement.scrollHeight;
                
                // 简化逻辑：当滚动超过首页底部时，固定页脚
                if (scrollTop > heroBottom - 100) { // 添加一些缓冲区域
                    footerSection.classList.add('fixed');
                } else {
                    footerSection.classList.remove('fixed');
                }
            }
        }
    </script>
